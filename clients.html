<!DOCTYPE html>
<html lang="en" data-theme="light" data-i18n-title="titleClients">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clients — RokoShots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body id="top">

<header>
  <div class="wrap">
    <a href="index.html#top" class="logo-home">Robin-Kovacs</a>

    <div class="header-right">
      <nav>
        <ul>
          <li><a href="clients.html" class="nav-clients" data-i18n="navClients">Clients</a></li>
          <li><a href="about.html" class="nav-gallery" data-i18n="navGallery">About</a></li>
        </ul>
      </nav>
      <a href="book-a-shoot.html" class="header-cta" data-i18n="headerCta">Book a Shoot</a>
      <div class="lang-switch" id="langSwitch">
        <button type="button" class="active" data-lang="en">En</button>
        <span class="divider">/</span>
        <button type="button" data-lang="hu">Hu</button>
      </div>
      <button type="button" class="theme-dots" id="themeToggle" aria-label="Toggle light and dark theme" data-i18n-aria-label="ariaToggleTheme">
        <span></span><span></span>
      </button>
      <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" data-i18n-aria-label="ariaOpenMenu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="mobile-menu" id="mobileMenu">
    <nav>
      <ul>
        <li><a href="clients.html" class="nav-clients" data-i18n="navClients">Clients</a></li>
        <li><a href="about.html" class="nav-gallery" data-i18n="navGallery">About</a></li>
      </ul>
    </nav>
    <a href="book-a-shoot.html" class="header-cta mobile-cta" data-i18n="headerCta">Book a Shoot</a>
    <div class="lang-switch mobile-lang" id="langSwitchMobile">
      <button type="button" class="active" data-lang="en">En</button>
      <span class="divider">/</span>
      <button type="button" data-lang="hu">Hu</button>
    </div>
  </div>
</header>

<section class="clients-page-title">
  <div class="wrap">
    <h1 class="hero-name" data-i18n="clientsHeading">Clients</h1>
  </div>
</section>

<section class="clients-list" id="clientsList">
  <!-- client rows injected by clients.js, 5 per page -->
</section>

<div class="clients-pagination" id="clientsPagination">
  <button type="button" class="clients-page-arrow" id="clientsPagePrev" aria-label="Previous page" data-i18n-aria-label="ariaPrevPage">&#8592;</button>
  <span class="clients-page-count" id="clientsPageCount"></span>
  <button type="button" class="clients-page-arrow" id="clientsPageNext" aria-label="Next page" data-i18n-aria-label="ariaNextPage">&#8594;</button>
</div>

<div class="client-lightbox" id="clientLightbox">
  <button type="button" class="cl-arrow left" id="clPrev" aria-label="Previous photo" data-i18n-aria-label="ariaLightboxPrev">&#8592;</button>
  <div class="cl-stage">
    <img id="clImg" src="" alt="">
  </div>
  <button type="button" class="cl-arrow right" id="clNext" aria-label="Next photo" data-i18n-aria-label="ariaLightboxNext">&#8594;</button>

  <div class="cl-bar">
    <button type="button" class="cl-close" id="clClose" data-i18n="clCloseBtn">[ X ] Close</button>
    <div class="cl-name" id="clName"></div>
    <div class="cl-count" id="clCount"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-grid">
    <a href="book-a-shoot.html" class="footer-tile">
      <div class="footer-tile-photo"><img src="/1.jpeg" alt="Contact RokoShots" data-i18n-alt="footerContactAlt"></div>
      <span class="footer-tile-label" data-i18n="footerContactLabel">Contact Me</span>
    </a>

    <div class="footer-newsletter">
      <h2 data-i18n="footerNewsletterTitle">Join my newsletter</h2>
      <a href="book-a-shoot.html" class="footer-newsletter-btn" data-i18n="footerReserveBtn">Reserve a Shoot</a>
    </div>

    <a href="https://www.instagram.com/rokoshots" target="_blank" rel="noopener" class="footer-tile">
      <div class="footer-tile-photo"><img src="/2.jpg" alt="RokoShots on Instagram" data-i18n-alt="footerInstagramAlt"></div>
      <span class="footer-tile-label" data-i18n="footerInstagramLabel">Instagram</span>
    </a>
  </div>

  <div class="footer-mark">&copy; &#8734; RokoShots</div>
</footer>

<script src="i18n.js"></script>
<script src="clients.js"></script>
</body>
</html>
