<!DOCTYPE html>
<html lang="en" data-theme="light" data-i18n-title="titleBooking">
<head>

<link rel="stylesheet" href="style.css">
</head>
<body id="top">

<header>
  <div class="wrap">
    <a href="index.html#top" class="logo-home">Robin-Kovacs</a>

    <div class="header-right">
      <nav>
        <ul>
          <li><a href="clients.html" class="nav-clients" data-i18n="navClients">Clients</a></li>
          <li><a href="about.html" class="nav-gallery" data-i18n="navGallery">About</a></li>
        </ul>
      </nav>
      <a href="book-a-shoot.html" class="header-cta" data-i18n="headerCta">Book a Shoot</a>
      <div class="lang-switch" id="langSwitch">
        <button type="button" class="active" data-lang="en">En</button>
        <span class="divider">/</span>
        <button type="button" data-lang="hu">Hu</button>
      </div>
      <button type="button" class="theme-dots" id="themeToggle" aria-label="Toggle light and dark theme" data-i18n-aria-label="ariaToggleTheme">
        <span></span><span></span>
      </button>
      <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" data-i18n-aria-label="ariaOpenMenu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="mobile-menu" id="mobileMenu">
    <nav>
      <ul>
        <li><a href="clients.html" class="nav-clients" data-i18n="navClients">Clients</a></li>
        <li><a href="about.html" class="nav-gallery" data-i18n="navGallery">About</a></li>
      </ul>
    </nav>
    <a href="book-a-shoot.html" class="header-cta mobile-cta" data-i18n="headerCta">Book a Shoot</a>
    <div class="lang-switch mobile-lang" id="langSwitchMobile">
      <button type="button" class="active" data-lang="en">En</button>
      <span class="divider">/</span>
      <button type="button" data-lang="hu">Hu</button>
    </div>
  </div>
</header>

<section class="booking-title">
  <div class="wrap">
    <h1 class="hero-name" data-i18n="bookingPageHeading">Book a Shoot</h1>
  </div>
</section>

<section class="booking-band">
  <div class="booking-grid">

    <div class="booking-photos left">
      <div class="booking-photo" id="bpLeft1"><img src="A1.jpg" alt=""></div>
      <div class="booking-photo" id="bpLeft2"><img src="A4.jpg" alt=""></div>
    </div>

    <div class="booking-form-card">
      <h2 data-i18n="reserveYourTime">Reserve Your Time</h2>
      <p class="booking-sub" data-i18n="bookingSub">Answer a few questions and pick a slot — we'll email your reservation request straight to our team.</p>

      <form id="bookingForm">
        <div class="bf-row">
          <div class="bf-field">
            <label data-i18n="labelFullName">Full Name</label>
            <input type="text" name="name" required>
          </div>
          <div class="bf-field">
            <label data-i18n="labelCompany">Company</label>
            <input type="text" name="company">
          </div>
        </div>

        <div class="bf-row">
          <div class="bf-field">
            <label data-i18n="labelEmail">Email</label>
            <input type="email" name="email" required>
          </div>
          <div class="bf-field">
            <label data-i18n="labelPhone">Phone</label>
            <input type="tel" name="phone">
          </div>
        </div>

        <div class="bf-row">
          <div class="bf-field">
            <label data-i18n="labelProjectType">Project Type</label>
            <select name="projectType">
              <option data-i18n="optRestaurant">Restaurant</option>
              <option data-i18n="optHotel">Hotel</option>
              <option data-i18n="optCafe">Café</option>
              <option data-i18n="optTourism">Tourism / Travel Brand</option>
              <option data-i18n="optOther">Other</option>
            </select>
          </div>
          <div class="bf-field">
            <label data-i18n="labelShootLocation">Shoot Location</label>
            <input type="text" name="location" placeholder="City / venue" data-i18n-placeholder="placeholderLocation">
          </div>
        </div>

        <div class="bf-field">
          <label data-i18n="labelShootDuration">Shoot Duration</label>
          <select name="duration">
            <option value="1" data-i18n="durationOpt1">1 hour</option>
            <option value="2" data-i18n="durationOpt2">2 hours</option>
            <option value="4" data-i18n="durationOptHalf">Half day (4 hours)</option>
            <option value="8" data-i18n="durationOptFull">Full day (8 hours)</option>
          </select>
        </div>

        <div class="bf-field">
          <label data-i18n="labelTellUs">Tell us about the shoot</label>
          <textarea name="message" placeholder="What are we shooting, how many dishes/rooms/spaces, any deadlines..." data-i18n-placeholder="placeholderMessage"></textarea>
        </div>

        <button type="submit" class="reserve-btn" data-i18n="reserveMySlotBtn">Reserve My Slot</button>
        <p class="booking-note" id="bookingNote"></p>
      </form>
    </div>

    <div class="booking-photos right">
      <div class="booking-photo" id="bpRight1"><img src="A7.jpg" alt=""></div>
      <div class="booking-photo" id="bpRight2"><img src="A10.jpeg" alt=""></div>
    </div>

  </div>
</section>

<section class="booking-contact">
  <div class="wrap">
    <div class="contact-box">
      <a class="contact-item" href="tel:+36203128096">
        <span class="contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </span>
        <span class="contact-text">+36203128096</span>
      </a>
      <a class="contact-item" href="mailto:info@rokoshots.hu">
        <span class="contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
        </span>
        <span class="contact-text">info@rokoshots.hu</span>
      </a>
      <a class="contact-item" href="https://www.instagram.com/rokoshots" target="_blank" rel="noopener" aria-label="Instagram" data-i18n-aria-label="footerInstagramLabel">
        <span class="contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        </span>
        <span class="contact-text">@Rokoshots</span>
      </a>
    </div>
  </div>
</section>

<script src="i18n.js"></script>
<script src="booking.js"></script>
</body>
</html>
